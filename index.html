<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar & Adjective Ace 🏆</title>
    <style>
        :root {
            --primary: #8338EC;
            --secondary: #FF006E;
            --tertiary: #3A86FF;
            --bg: #F8F9FA;
            --text: #2B2D42;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .app-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 650px;
            text-align: center;
        }
        h1 {
            color: var(--primary);
            margin-bottom: 5px;
        }
        .tabs {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 20px;
            background: #E9ECEF;
            border-radius: 10px;
            overflow: hidden;
        }
        .tab {
            flex: 1;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            color: #6C757D;
            min-width: 120px;
        }
        .tab.active {
            background: var(--primary);
            color: white;
        }
        .card {
            background: #F8F9FA;
            border: 2px dashed #DEE2E6;
            padding: 30px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-size: 1.2em;
            line-height: 1.8;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .hint-text {
            color: #8D99AE;
            font-size: 0.85em;
            margin-bottom: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .sentence-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 1em;
            border: 2px solid #DEE2E6;
            border-radius: 8px;
            text-align: center;
            transition: 0.3s;
            font-weight: bold;
            color: var(--tertiary);
            width: 140px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 8px rgba(255, 0, 110, 0.3);
        }
        .verb-hint {
            display: block;
            color: var(--secondary);
            font-weight: bold;
            margin-top: 5px;
            font-size: 1.1em;
        }
        .btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 15px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 0, 110, 0.4);
        }
        .feedback {
            margin-top: 15px;
            font-weight: bold;
            min-height: 28px;
            font-size: 1.1em;
        }
        .correct { color: #2A9D8F; }
        .incorrect { color: #E76F51; }
        .warning { color: #F4A261; }
        
        /* Adjective Specific Styles */
        .adj-base {
            font-size: 2.5em;
            color: var(--tertiary);
            font-weight: bold;
            margin-bottom: 25px;
            text-transform: capitalize;
        }
        .adj-inputs {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        .adj-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            max-width: 380px;
            gap: 10px;
        }
        .adj-label {
            font-weight: bold;
            color: #6C757D;
            width: 120px;
            text-align: right;
            font-size: 0.9em;
        }
        .adj-the {
            font-weight: bold;
            color: var(--text);
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Grammar & Adjective Ace 🏆</h1>
    
    <div class="tabs">
        <div class="tab active" onclick="switchMode('future')" id="tab-future">Future Simple</div>
        <div class="tab" onclick="switchMode('goingTo')" id="tab-goingTo">"Going To"</div>
        <div class="tab" onclick="switchMode('adjectives')" id="tab-adjectives">Adjectives</div>
    </div>

    <div class="card" id="card-area">
        <!-- Content will be injected here by JavaScript -->
    </div>

    <button class="btn" style="background: var(--primary); width: 100%;" onclick="nextQuestion()">Next Question ➡️</button>
</div>

<script>
    // --- DATA MODULES ---

    const futureData = [
        { parts: ["Sharon", "his grandparents next Monday."], hint: "visit", answers: [["will visit"]] },
        { parts: ["Many tourists", "in Israel in the summer."], hint: "arrive", answers: [["will arrive"]] },
        { parts: ["I", "to London this summer."], hint: "not fly", answers: [["will not fly", "won't fly"]] },
        { parts: ["Who", "with me to the beach tomorrow?"], hint: "come", answers: [["will come"]] },
        { parts: ["When", "the test", "?"], hint: "start", answers: [["will"], ["start"]] },
        { parts: ["They", "to the cinema tonight."], hint: "not go", answers: [["will not go", "won't go"]] },
        { parts: ["Where", "you", "next week?"], hint: "travel", answers: [["will"], ["travel"]] }
    ];

    const goingToData = [
        { parts: ["The temperatures", "tomorrow."], hint: "rise", answers: [["are going to rise"]] },
        { parts: ["", "the airplane", "soon?"], hint: "land", answers: [["is"], ["going to land"]] },
        { parts: ["I", "basketball next week, because my hand still hurts."], hint: "not play", answers: [["am not going to play", "m not going to play", "'m not going to play"]] }
    ];

    const adjectiveData = [
        { base: "easy", comp: ["easier"], sup: ["easiest"] },
        { base: "short", comp: ["shorter"], sup: ["shortest"] },
        { base: "heavy", comp: ["heavier"], sup: ["heaviest"] },
        { base: "strong", comp: ["stronger"], sup: ["strongest"] },
        { base: "weak", comp: ["weaker"], sup: ["weakest"] },
        { base: "calm", comp: ["calmer"], sup: ["calmest"] },
        { base: "hard", comp: ["harder"], sup: ["hardest"] },
        { base: "tiny", comp: ["tinier"], sup: ["tiniest"] },
        { base: "nice", comp: ["nicer"], sup: ["nicest"] },
        { base: "hot", comp: ["hotter"], sup: ["hottest"] },
        { base: "interesting", comp: ["more interesting"], sup: ["most interesting"] },
        { base: "boring", comp: ["more boring"], sup: ["most boring"] },
        { base: "exciting", comp: ["more exciting"], sup: ["most exciting"] },
        { base: "wonderful", comp: ["more wonderful"], sup: ["most wonderful"] },
        { base: "anxious", comp: ["more anxious"], sup: ["most anxious"] },
        { base: "fascinating", comp: ["more fascinating"], sup: ["most fascinating"] },
        { base: "peaceful", comp: ["more peaceful"], sup: ["most peaceful"] },
        { base: "pleasant", comp: ["more pleasant"], sup: ["most pleasant"] },
        { base: "thoughtful", comp: ["more thoughtful"], sup: ["most thoughtful"] },
        { base: "good", comp: ["better"], sup: ["best"] },
        { base: "bad", comp: ["worse"], sup: ["worst"] },
        { base: "far", comp: ["farther", "further"], sup: ["farthest", "furthest"] }
    ];

    // --- APP STATE ---
    let currentMode = 'future';
    let currentIndex = 0;
    let attempts = 0;

    // --- CORE LOGIC ---
    function init() {
        shuffleArray(futureData);
        shuffleArray(goingToData);
        shuffleArray(adjectiveData);
        loadQuestion();
    }

    function switchMode(mode) {
        currentMode = mode;
        currentIndex = 0;
        
        document.getElementById('tab-future').classList.remove('active');
        document.getElementById('tab-goingTo').classList.remove('active');
        document.getElementById('tab-adjectives').classList.remove('active');
        
        document.getElementById(`tab-${mode}`).classList.add('active');
        loadQuestion();
    }

    function loadQuestion() {
        attempts = 0;
        const cardArea = document.getElementById('card-area');
        cardArea.innerHTML = ''; // Clear previous

        if (currentMode === 'future' || currentMode === 'goingTo') {
            const dataSet = currentMode === 'future' ? futureData : goingToData;
            const q = dataSet[currentIndex];
            const title = currentMode === 'future' ? "Future Simple (will + verb)" : '"Be" (am/is/are) + going to + verb';
            
            let html = `<div class="hint-text">${title}</div><div class="sentence-container">`;
            
            // Build dynamic sentence layout based on how many "parts" there are
            for (let i = 0; i < q.parts.length; i++) {
                if (q.parts[i] !== "") {
                    html += `<span>${q.parts[i]}</span>`;
                }
                if (i < q.answers.length) {
                    html += `<input type="text" id="ans-${i}" autocomplete="off">`;
                }
            }
            
            html += `</div>
                     <div class="verb-hint">(${q.hint})</div>
                     <button class="btn" onclick="checkSentence()">Check Answer</button>
                     <div class="feedback" id="feedback-message"></div>`;
            
            cardArea.innerHTML = html;

        } else if (currentMode === 'adjectives') {
            const q = adjectiveData[currentIndex];
            cardArea.innerHTML = `
                <div class="hint-text">Comparative & Superlative</div>
                <div class="adj-base">${q.base}</div>
                
                <div class="adj-inputs">
                    <div class="adj-row">
                        <span class="adj-label">Comparative (יותר מ):</span>
                        <input type="text" id="comp-ans" autocomplete="off">
                    </div>
                    <div class="adj-row">
                        <span class="adj-label">Superlative (הכי):</span>
                        <span class="adj-the">the</span>
                        <input type="text" id="sup-ans" autocomplete="off">
                    </div>
                </div>
                
                <button class="btn" onclick="checkAdjective()">Check Answer</button>
                <div class="feedback" id="feedback-message"></div>
            `;
        }
    }

    function checkSentence() {
        const dataSet = currentMode === 'future' ? futureData : goingToData;
        const q = dataSet[currentIndex];
        let allCorrect = true;

        for (let i = 0; i < q.answers.length; i++) {
            const userInput = document.getElementById(`ans-${i}`).value.trim().toLowerCase().replace(/\s+/g, ' ');
            const acceptableAnswers = q.answers[i];
            
            if (!acceptableAnswers.includes(userInput)) {
                allCorrect = false;
                break;
            }
        }
        handleFeedback(allCorrect, q.answers.map(arr => arr[0]).join(' ... '));
    }

    function checkAdjective() {
        const q = adjectiveData[currentIndex];
        const compInput = document.getElementById('comp-ans').value.trim().toLowerCase().replace(/\s+/g, ' ');
        const supInput = document.getElementById('sup-ans').value.trim().toLowerCase().replace(/\s+/g, ' ');

        const compCorrect = q.comp.includes(compInput);
        const supCorrect = q.sup.includes(supInput);
        
        handleFeedback(compCorrect && supCorrect, `${q.comp[0]} / the ${q.sup[0]}`);
    }

    function handleFeedback(isCorrect, rightAnswerText) {
        const feedback = document.getElementById('feedback-message');
        
        if (isCorrect) {
            feedback.innerHTML = "✨ Outstanding! ✨";
            feedback.className = "feedback correct";
            attempts = 0; 
        } else {
            attempts++;
            if (attempts >= 3) {
                feedback.innerHTML = `Let's learn this one! The correct answer is: <b>${rightAnswerText}</b>`;
                feedback.className = "feedback incorrect";
            } else {
                const triesLeft = 3 - attempts;
                feedback.innerHTML = `Not quite right! Double-check your spelling. (${triesLeft} attempt${triesLeft > 1 ? 's' : ''} left)`;
                feedback.className = "feedback warning";
            }
        }
    }

    function nextQuestion() {
        if (currentMode === 'future') {
            currentIndex = (currentIndex + 1) % futureData.length;
        } else if (currentMode === 'goingTo') {
            currentIndex = (currentIndex + 1) % goingToData.length;
        } else {
            currentIndex = (currentIndex + 1) % adjectiveData.length;
        }
        loadQuestion();
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    window.onload = init;
</script>

</body>
</html>
